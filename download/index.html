*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:T,system-ui,sans-serif;color:#fff;position:relative;overflow-x:hidden;min-height:100vh;min-height:100dvh;

.grain{position:fixed;inset:0;opacity:.5;mix-blend-mode:overlay;background:url('noise.png');background-size:512px 512px;pointer-events:none}

h1{margin-top:6vh;font-weight:900;line-height:1.15;text-shadow:0 6px 22px rgba(50,20,6,.25)}
h1 .a{display:block;font-size:clamp(46px,13vw,84px);color:#fff}
h1 .b{display:block;font-size:clamp(54px,15.5vw,98px);color:#FFE3BF}
p.sub{margin-top:3vh;font-weight:700;font-size:clamp(19px,5vw,26px);line-height:1.9;color:#FFF1E0}
.stores{margin-top:auto;padding-top:6vh;display:flex;flex-direction:column;gap:14px}
.store{display:flex;align-items:center;gap:18px;background:#000;color:#fff;border-radius:28px;padding:18px 26px;text-decoration:none;min-height:92px;transition:transform .15s}
.store:active{transform:scale(.98)}
.store svg{width:48px;height:48px;flex:none;fill:#fff}
.store .t{display:flex;flex-direction:column;flex:1}
.store small{font-size:15px;font-weight:500;opacity:.85;margin-bottom:2px}
.store b{font-size:30px;font-weight:900;line-height:1.2}
.wa{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:14px;color:#fff;text-decoration:none;font-weight:700;font-size:19px;padding:14px 20px;border:2px solid rgba(255,241,224,.7);border-radius:22px;background:rgba(0,0,0,.18)}
.wa svg{width:26px;height:26px;fill:#fff;flex:none}
.foot{margin-top:18px;text-align:center;font-size:14px;font-weight:500;color:#FFE3BF;opacity:.9}
@media(min-width:700px){main{justify-content:center}.stores{margin-top:6vh;flex-direction:row}.store{flex:1}}
